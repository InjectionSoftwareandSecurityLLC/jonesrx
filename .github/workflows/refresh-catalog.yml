name: Refresh catalog

on:
  schedule:
    - cron: '17 7 * * *'      # daily, 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild catalog from the iTunes lookup API
        run: python3 tools/fetch_catalog.py

      - name: Commit if the catalog moved
        run: |
          if git diff --quiet -- js/catalog-data.js; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/catalog-data.js
          git commit -m "chore: refresh catalog data"
          git push
